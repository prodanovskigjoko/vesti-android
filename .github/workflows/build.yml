name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test core and build debug APK
        run: ./gradlew :core:test :app:assembleDebug --stacktrace

      - name: Publish APK as the "Најнова тест верзија" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk vesti.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest vesti.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Најнова тест верзија" \
            --notes "Тест (debug) верзија од commit ${GITHUB_SHA::7}. Отвори ја оваа страница на телефон и симни го vesti.apk."
