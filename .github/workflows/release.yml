name: Release to Google Play (internal)

# Push a tag such as v0.1.6 to build a signed AAB and upload it to the internal testing track:
#   git tag v0.1.6 && git push origin v0.1.6
# Run it by hand (Actions -> Run workflow) for a test: it builds and signs, but does NOT upload to Play.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the test build, e.g. 0.1.6 (nothing is uploaded to Play)'
        required: true
        default: '0.0.1'

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag (v1.2.3 -> versionName 1.2.3, versionCode 10203)
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_VERSION"; else TAG="${GITHUB_REF_NAME#v}"; fi
          if [[ ! "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version must look like 1.2.3 (tag v1.2.3), got '$TAG'"; exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "versionName=$TAG versionCode=$CODE"

      - name: Restore upload keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Test core and build signed release bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :core:test :app:bundleRelease --stacktrace

      - name: Check the bundle is signed
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          unzip -l "$AAB" | grep -Eq 'META-INF/[^/]+\.(RSA|EC|DSA)$' \
            || { echo "::error::AAB is not signed"; exit 1; }

      - name: Keep the AAB as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vesti-${{ env.VERSION_NAME }}.aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play internal testing
        if: github.event_name == 'push'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: mk.vesti.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          # While the app has never been published in Play Console, Google only accepts "draft".
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          releaseName: ${{ env.VERSION_NAME }}
