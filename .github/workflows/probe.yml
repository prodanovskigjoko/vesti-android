name: Probe outage pages

on:
  push:
    branches: [probe-outages]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch EVN and Vodovod pages
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (Linux; Android 14) VestiProbe/0.1"
          fetch() { # name url
            code=$(curl -sL -m 30 -A "$UA" -o "probe/$1.html" -w "%{http_code} %{url_effective}" "$2" || echo "ERR")
            echo "$1 $2 -> $code" | tee -a probe/index.txt
          }
          rm -f probe/*
          curl -sL -m 30 -A "$UA" -H "Accept: application/json" -H "Origin: https://elektrodistribucija.mk" -H "Referer: https://elektrodistribucija.mk/Grid/OutagesMap.aspx" \
            -o probe/evn_outages.json -w "%{http_code} %{content_type}\n" https://portal-api.elektrodistribucija.mk/DSO/Prekini/ZemiPrekini | tee probe/index.txt
          python3 -c "import json;d=json.load(open('probe/evn_outages.json'));print(type(d).__name__, len(d));print(json.dumps(d[:5],ensure_ascii=False,indent=1))" | tee -a probe/index.txt || head -c 2000 probe/evn_outages.json
          ls -la probe
      - name: Save results on this branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add probe
          git commit -m "Probe results [skip ci]" || exit 0
          git push
