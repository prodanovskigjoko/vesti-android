name: Probe outage pages

on:
  push:
    branches: [probe-outages]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch EVN and Vodovod pages
        run: |
          mkdir -p probe
          UA="Mozilla/5.0 (Linux; Android 14) VestiProbe/0.1"
          fetch() { # name url
            code=$(curl -sL -m 30 -A "$UA" -o "probe/$1.html" -w "%{http_code} %{url_effective}" "$2" || echo "ERR")
            echo "$1 $2 -> $code" | tee -a probe/index.txt
          }
          rm -f probe/*
          fetch evn_map https://elektrodistribucija.mk/Grid/OutagesMap.aspx
          fetch evn_map_mk "https://elektrodistribucija.mk/Grid/OutagesMap.aspx?lang=mk-mk"
          fetch evn_announcements https://elektrodistribucija.mk/Media/Public-announcements.aspx
          # Script and API references inside the outage map, to find the data endpoint.
          grep -hoiE '(src|href)="[^"]+\.js[^"]*"|https?://[^"'"'"' ]+(api|json|outage|isklu)[^"'"'"' ]*|/[A-Za-z0-9_/.-]*(Outage|outage|Api|api|Handler|ashx|asmx|svc)[^"'"'"' ]*' probe/evn_map*.html | sort -u > probe/evn_refs.txt || true
          n=0
          grep -oE '(src)="[^"]+\.js[^"]*"' probe/evn_map.html | sed -E 's/src="([^"]+)"/\1/' | grep -viE 'jquery|bootstrap|google|gtag|cloudflare' | head -8 | while read -r js; do
            n=$((n+1)); case "$js" in http*) u="$js";; *) u="https://elektrodistribucija.mk$js";; esac
            fetch "evn_js$n" "$u"
          done
          ls -la probe
      - name: Save results on this branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add probe
          git commit -m "Probe results [skip ci]" || exit 0
          git push
